description: >
  Things that currently crash on Python 3. These recordings pin the crash
  (the error type and message are part of the recording) so that fixing it
  is a deliberate, visible change to this test.
  Stages 1-3: seed dispersal methods 0, 1 and 2 fail when the first seed is
  dispersed, because the terrain code that runs after dispersal reads
  theDistance, which only methods 3 and 4 set.
species: [species/generic/Generic Angiosperm.yml]
species_variants:
  Disperse0.yml:
    base: species/generic/Generic Angiosperm.yml
    set: {nameSpecies: Disperse random, seedDispersalMethod: [0]}
  Disperse1.yml:
    base: species/generic/Generic Angiosperm.yml
    set: {nameSpecies: Disperse drop, seedDispersalMethod: [1]}
  Disperse2.yml:
    base: species/generic/Generic Angiosperm.yml
    set: {nameSpecies: Disperse circle, seedDispersalMethod: [2, 6]}
files:
  placement0.csv: placement/disperse0.csv
  placement1.csv: placement/disperse1.csv
  placement2.csv: placement/disperse2.csv
stages:
  - seed: 1003
    args: [-n, disperse0, -w, "20", -sf, placement0.csv, -t, "20", -a, a, -f, n]
  - seed: 1004
    args: [-n, disperse1, -w, "20", -sf, placement1.csv, -t, "20", -a, a, -f, n]
  - seed: 1005
    args: [-n, disperse2, -w, "20", -sf, placement2.csv, -t, "20", -a, a, -f, n]
