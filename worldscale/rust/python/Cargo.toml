[package]
name = "worldscale_core"
description = "The compiled engine for Vida's world-scale prototype, as a Python module"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "worldscale_core"
crate-type = ["cdylib"]

[dependencies]
worldscale-engine = { path = "../engine" }
# abi3: one build works with every Python from 3.8 on
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
numpy = "0.29"
rayon = "1"

[features]
system-maths = ["worldscale-engine/system-maths"]
