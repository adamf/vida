# Vida's world-scale prototype in Rust: three crates that build together.
#   engine   the model and one rank's share of the world (no Python, no MPI)
#   python   worldscale_core, the Python module (built with maturin)
#   cli      the worldscale command, on one computer or over MPI
[workspace]
members = ["engine", "python", "cli"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
# licence: see LICENSE.txt at the top of the Vida repository
publish = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
